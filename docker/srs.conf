# SRS 服务端配置（容器内使用）
# 说明：在官方 docker.conf 基础上，补充了「推流上线/下线回调」与播放相关优化，
#      推流设置（第三方转推、混流、录制）由 srs-control 控制面通过其 HTTP API 实现。

listen              1935;
max_connections     10000;
daemon              off;
srs_log_tank        console;
srs_log_level       info;

# 生成 HLS 分片时的切片时长（秒）
http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

vhost __defaultVhost__ {
    # 推流上下线回调：控制面据此触发自动录制与自动转推。
    http_hooks {
        enabled         on;
        on_publish      http://127.0.0.1:1986/hooks/on_publish;
        on_unpublish    http://127.0.0.1:1986/hooks/on_unpublish;
    }

    # HTTP-FLV 低延迟播放：http://host:8080/live/xxx.flv
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    # HLS 播放：http://host:8080/live/xxx.m3u8
    hls {
        enabled         on;
        hls_fragment    2;
        hls_window      10;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
    }

    # 秒开优化
    play {
        gop_cache       on;
        queue_length    10;
        mw_latency      100;
    }
}
