# 全部使用官方 / 公开镜像，安装时不需要本地构建（docker compose up 直接 pull + 运行）。
#
#   srs     : ossrs/srs:8     官方 SRS（版本 8.0.74，与项目编译版一致；我们没改过 SRS 源码）
#   control : jrottenberg/ffmpeg:4.4-ubuntu  自带 ffmpeg，跑包内预编译的静态二进制
#
# 端口 / 地址契约（每条 endpoint 对应一条 ports 映射，宿主端口由捷兔桌面分配）：
#   - 容器内端口固定：control 1986、srs 1935（jdconfig.endpoints[].containerPort）
#   - 宿主端口由桌面分配，冲突时自动改号（1935→1936），并通过下面两种通道告知容器：
#       1) POST /jetdesk/config {"endpoints":[{"name":"rtmp","hostPort":1936}]}   ← 推荐
#       2) 环境变量 JETDESK_PORT_<容器端口> / JETDESK_ENDPOINT_<NAME>_PORT
#   - 包内**不写** PUBLIC_RTMP、不写死 127.0.0.1，避免覆盖桌面回告的 hostPort
#
# 变量缺省值说明：ports 里写 "${VAR:-默认}:容器端口"（显式映射，不能只写容器端口）；
# 注入给容器的告知变量一律写 "${VAR:-}"（没设置就是空＝「没告知」，
# 绝不能写成 ":-1935"，那会把「不知道」伪装成「就是 1935」）。
services:
  srs:
    image: ossrs/srs:8
    container_name: jetstream-srs
    restart: unless-stopped
    # SRS 启动时校验 max_connections 与文件句柄上限
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      # 显式映射宿主端口（只有容器端口会让桌面 injectEndpointEnv 报「没有发布」）
      - "${SRS_RTMP_PORT:-1935}:1935"
    # HTTP-FLV / HLS / 原生 API 只在容器网络内可达，
    # 外部统一经控制面（1986）反代，从而受访问密钥保护
    expose:
      - "8080"
      - "1985"
    environment:
      TZ: Asia/Shanghai
      # ——— 端口/密钥环境变量：按规范「所有目标服务都注入」———
      # JETDESK_PORT_<容器端口>：本服务（srs）也要知道 1986 与 1935 的宿主端口
      JETDESK_PORT_1986: "${UI_PORT:-}"
      JETDESK_PORT_1935: "${SRS_RTMP_PORT:-}"
      # 端口所属服务的端点变量（本服务是 rtmp：1935）
      JETDESK_ENDPOINT_RTMP_CONTAINER_PORT: "1935"
      JETDESK_ENDPOINT_RTMP_PORT: "${SRS_RTMP_PORT:-}"
      JETDESK_ENDPOINT_RTMP_HOST: "${JETDESK_LAN_IP:-}"
      # RTMP 的 _URL 不带 ?key=（推流口令在推流 URL 里单独拼，不能用 access_key）
      JETDESK_ENDPOINT_RTMP_URL: "${JETDESK_ENDPOINT_RTMP_URL:-}"
      JETDESK_ENDPOINT_RTMP_BASE: "${JETDESK_ENDPOINT_RTMP_BASE:-}"
      # ——— 全局变量：所有目标服务都注入 ———
      JETDESK_ACCESS_KEY: "${JETDESK_ACCESS_KEY:-}"
      JETDESK_LAN_IP: "${JETDESK_LAN_IP:-}"
      JETDESK_COMMUNITY_BASE: "${JETDESK_COMMUNITY_BASE:-}"
      JETDESK_INSTANCE_ID: "${JETDESK_INSTANCE_ID:-}"
    volumes:
      - "./srs/srs.conf:/usr/local/srs/conf/srs.conf:ro"
    command: ["./objs/srs", "-c", "conf/srs.conf"]

  control:
    image: jrottenberg/ffmpeg:4.4-ubuntu
    container_name: jetstream-control
    restart: unless-stopped
    depends_on:
      srs:
        condition: service_started
    entrypoint: ["/app/entrypoint.sh"]
    ports:
      # configPort 也要映射：桌面按 jdconfig.models.services.control.configPort 推配置，
      # 只 expose 不映射会被平台拦下（报「configPort 未发布」）。
      - "${UI_PORT:-1986}:1986"
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      SRS_API: http://srs:1985
      SRS_HTTP_BASE: http://srs:8080
      RTMP_BASE: rtmp://srs:1935/
      # ——— 端口/密钥环境变量 ———
      # JETDESK_PORT_<容器端口>：所有目标服务都要注入（控制面同时要 1986 与 1935）
      JETDESK_PORT_1986: "${UI_PORT:-}"
      JETDESK_PORT_1935: "${SRS_RTMP_PORT:-}"
      # 端口所属服务的端点变量（控制面是 http：1986）；HTTP 的 _URL 允许带 ?key=<access_key>
      JETDESK_ENDPOINT_HTTP_CONTAINER_PORT: "1986"
      JETDESK_ENDPOINT_HTTP_PORT: "${UI_PORT:-}"
      JETDESK_ENDPOINT_HTTP_HOST: "${JETDESK_LAN_IP:-}"
      JETDESK_ENDPOINT_HTTP_URL: "${JETDESK_ENDPOINT_HTTP_URL:-}"
      JETDESK_ENDPOINT_HTTP_BASE: "${JETDESK_ENDPOINT_HTTP_BASE:-}"
      # ——— 全局变量：所有目标服务都注入 ———
      # JETDESK_ACCESS_KEY 只当「首次启动的初始值」用：持久化在 /data/config.json 的口令
      # 优先级更高，重启不会把用户在控制台/桌面改过的口令冲掉。
      JETDESK_ACCESS_KEY: "${JETDESK_ACCESS_KEY:-}"
      JETDESK_LAN_IP: "${JETDESK_LAN_IP:-}"
      JETDESK_COMMUNITY_BASE: "${JETDESK_COMMUNITY_BASE:-}"
      JETDESK_INSTANCE_ID: "${JETDESK_INSTANCE_ID:-}"
      # configToken（公开、只防误连；不是口令），与 jdconfig 的 configToken 保持一致
      JETDESK_CONFIG_TOKEN: "jetool"
      # 只有不用桌面、自己 docker compose 起来时才需要手动指定（填了就以它为准）：
      # PUBLIC_RTMP: "rtmp://192.168.1.10:1935/"
      # 配置推送的严格门禁：默认开（1）。仅排障时设 0 可临时跳过密钥校验，用完请改回。
      # JETDESK_CONFIG_STRICT: "1"
    volumes:
      # /data 持久化 config.json（设置/口令）与 endpoints.json（宿主端口绑定）
      - "./control/entrypoint.sh:/app/entrypoint.sh:ro"
      - "./control/bin:/app/bin:ro"
      - "${JETDESK_PROJECT_ROOT}/data:/data"
    # 转推目标若在宿主机上（如另一套 RTMP 服务），容器里要用 host.docker.internal，
    # Windows/macOS 的 Docker Desktop 与 Linux 的 host-gateway 都靠这条映射。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:1986/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
