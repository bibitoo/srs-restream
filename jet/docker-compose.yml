# 全部使用官方 / 公开镜像，安装时不需要本地构建（docker compose up 直接 pull + 运行）。
#
#   srs     : ossrs/srs:8     官方 SRS（版本 8.0.74，与项目编译版一致；我们没改过 SRS 源码）
#   control : jrottenberg/ffmpeg:4.4-ubuntu  自带 ffmpeg，跑包内预编译的静态二进制
#
services:
  srs:
    image: ossrs/srs:8
    container_name: jetstream-srs
    restart: unless-stopped
    # SRS 启动时校验 max_connections 与文件句柄上限
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      # 只暴露 RTMP：推流鉴权由控制面的 on_publish 校验 ?key=
      - "${SRS_RTMP_PORT:-1935}:1935"
    # HTTP-FLV / HLS / 原生 API 只在容器网络内可达，
    # 外部统一经控制面（1986）反代，从而受访问密钥保护
    expose:
      - "8080"
      - "1985"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - "./srs/srs.conf:/usr/local/srs/conf/srs.conf:ro"
    command: ["./objs/srs", "-c", "conf/srs.conf"]

  control:
    image: jrottenberg/ffmpeg:4.4-ubuntu
    container_name: jetstream-control
    restart: unless-stopped
    depends_on:
      srs:
        condition: service_started
    entrypoint: ["/app/entrypoint.sh"]
    ports:
      - "${UI_PORT:-1986}:1986"
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      SRS_API: http://srs:1985
      SRS_HTTP_BASE: http://srs:8080
      RTMP_BASE: rtmp://srs:1935/
      PUBLIC_RTMP: rtmp://127.0.0.1:${SRS_RTMP_PORT:-1935}/
      PUBLIC_BASE: ""
      # ACCESS_KEY 只是「首次启动的初始值」，不是写死：桌面通过 POST /jetdesk/config
      # ACCESS_KEY 只是「首次启动的初始值」，不是写死：桌面/控制台改过的密钥会持久化到
      # /data/config.json，重启后仍是用户的值（持久化优先级高于本变量）。
      # 这里不设，交给默认初值 jetool；如需指定初值再取消注释。
      # ACCESS_KEY: ${ACCESS_KEY:-jetool}
      # 配置推送的严格门禁：默认开（1）。仅排障时设 0 可临时跳过密钥校验，用完请改回。
      # JETDESK_CONFIG_STRICT: "1"
    volumes:
      - "./control/entrypoint.sh:/app/entrypoint.sh:ro"
      - "./control/bin:/app/bin:ro"
      - "${JETDESK_PROJECT_ROOT}/data:/data"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:1986/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
