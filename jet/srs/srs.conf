# SRS 服务端配置（.jet 包内，srs 服务专用）
#
# 与「单容器版」的差异：http_hooks 指向 compose 里的 control 服务，
# 而不是 127.0.0.1 —— 因为 SRS 与控制面跑在两个容器里。

listen              1935;
max_connections     10000;
daemon              off;
srs_log_tank        console;
srs_log_level       info;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

vhost __defaultVhost__ {
    # 推流上下线回调控制面：触发自动录制、自动转推
    http_hooks {
        enabled         on;
        on_publish      http://control:1986/hooks/on_publish;
        on_unpublish    http://control:1986/hooks/on_unpublish;
    }

    # HTTP-FLV 低延迟播放
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    # HLS 播放
    hls {
        enabled         on;
        hls_fragment    2;
        hls_window      10;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
    }

    # 秒开优化
    play {
        gop_cache       on;
        queue_length    10;
        mw_latency      100;
    }
}
